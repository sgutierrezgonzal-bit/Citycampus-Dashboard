document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#888;margin-bottom:16px;\">Proposta di progetto<\u002Fp>\n        <h1>Landing Page<br>Campus Margherita<\u002Fh1>\n      <\u002Fdiv>\n\n      <hr class=\"rule\">\n\n      <!-- ══ IL PROGETTO ══ -->\n      <div class=\"two-col\">\n        <div class=\"two-col-label\">Il<br>Progetto<\u002Fdiv>\n        <div class=\"two-col-content\">\n          <p class=\"body-text\">La landing page di Campus Margherita nasce con un obiettivo preciso: dare visibilità al primo campus di City Campus Vicenza, raccogliere contatti qualificati attraverso la proposta di date per visitare gli spazi, e presentare il progetto ai suoi pubblici di riferimento — studenti universitari, lavoratori in trasferta, turisti e persone coinvolte nelle sperimentazioni di co-living cooperativo.<\u002Fp>\n          <p class=\"body-text\">Il posizionamento organico e l'integrazione del Booking Engine sono gli strumenti su cui si fonda la capacità della pagina di generare traffico qualificato e prenotazioni reali fin dai primi giorni di apertura.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ══ PANORAMICA FASI ══ -->\n      <div class=\"section-header\">\n        <p>Panoramica<\u002Fp>\n        <p>Maggio — Luglio 2026<\u002Fp>\n      <\u002Fdiv>\n      <hr class=\"rule\">\n      <svg viewBox=\"0 0 700 370\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;display:block;overflow:visible;margin-bottom:64px;\" aria-label=\"Infografica fasi del progetto\">\n        <path d=\"M 60,110 L 640,110 A 55,55 0 0,1 640,220 L 60,220 A 55,55 0 0,0 60,330 L 640,330\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><\u002Fpath>\n        <circle cx=\"60\" cy=\"110\" r=\"3.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><\u002Fcircle>\n        <circle cx=\"60\" cy=\"110\" r=\"1.5\" fill=\"#111\"><\u002Fcircle>\n        <circle cx=\"260\" cy=\"110\" r=\"3.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><\u002Fcircle>\n        <circle cx=\"260\" cy=\"110\" r=\"1.5\" fill=\"#111\"><\u002Fcircle>\n        <circle cx=\"460\" cy=\"220\" r=\"3.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><\u002Fcircle>\n        <circle cx=\"460\" cy=\"220\" r=\"1.5\" fill=\"#111\"><\u002Fcircle>\n        <circle cx=\"260\" cy=\"330\" r=\"3.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><\u002Fcircle>\n        <circle cx=\"260\" cy=\"330\" r=\"1.5\" fill=\"#111\"><\u002Fcircle>\n        <circle cx=\"640\" cy=\"330\" r=\"3.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.2\"><\u002Fcircle>\n        <circle cx=\"640\" cy=\"330\" r=\"1.5\" fill=\"#111\"><\u002Fcircle>\n        <text x=\"72\" y=\"128\" font-family=\"'Space Mono', monospace\" font-size=\"8\" fill=\"#aaa\" letter-spacing=\"1\">AVVIO · MAGGIO 2026<\u002Ftext>\n        <text x=\"260\" y=\"91\" font-family=\"'Space Mono', monospace\" font-size=\"7.5\" fill=\"#888\" text-anchor=\"middle\" letter-spacing=\"0.8\">RICERCA E PROGETTAZIONE<\u002Ftext>\n        <text x=\"260\" y=\"102\" font-family=\"'Space Mono', monospace\" font-size=\"9\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"1.5\">FASE 01<\u002Ftext>\n        <text x=\"260\" y=\"130\" font-family=\"'Space Mono', monospace\" font-size=\"7\" fill=\"#ccc\" text-anchor=\"middle\" letter-spacing=\"0.5\">WIREFRAME APP. 16.06<\u002Ftext>\n        <text x=\"460\" y=\"201\" font-family=\"'Space Mono', monospace\" font-size=\"7.5\" fill=\"#888\" text-anchor=\"middle\" letter-spacing=\"0.8\">PRODUZIONE E SVILUPPO<\u002Ftext>\n        <text x=\"460\" y=\"212\" font-family=\"'Space Mono', monospace\" font-size=\"9\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"1.5\">FASE 02<\u002Ftext>\n        <text x=\"460\" y=\"237\" font-family=\"'Space Mono', monospace\" font-size=\"7\" fill=\"#ccc\" text-anchor=\"middle\" letter-spacing=\"0.5\">DA OGGI · ENTRO 3 LUGLIO<\u002Ftext>\n        <text x=\"260\" y=\"311\" font-family=\"'Space Mono', monospace\" font-size=\"7.5\" fill=\"#888\" text-anchor=\"middle\" letter-spacing=\"0.8\">REVISIONE E PUBBLICAZIONE<\u002Ftext>\n        <text x=\"260\" y=\"322\" font-family=\"'Space Mono', monospace\" font-size=\"9\" fill=\"#111\" text-anchor=\"middle\" font-weight=\"700\" letter-spacing=\"1.5\">FASE 03<\u002Ftext>\n        <text x=\"628\" y=\"311\" font-family=\"'Space Mono', monospace\" font-size=\"7.5\" fill=\"#888\" text-anchor=\"end\" letter-spacing=\"0.8\">3 LUGLIO 2026<\u002Ftext>\n        <text x=\"628\" y=\"322\" font-family=\"'Space Mono', monospace\" font-size=\"9\" fill=\"#111\" text-anchor=\"end\" font-weight=\"700\" letter-spacing=\"1.5\">GO-LIVE<\u002Ftext>\n      <\u002Fsvg>\n\n      <!-- ══ LAVORO SVOLTO ══ -->\n      <div class=\"section-header\">\n        <p>Lavoro svolto<\u002Fp>\n        <p>Maggio — Giugno 2026<\u002Fp>\n      <\u002Fdiv>\n      <hr class=\"rule\">\n\n      <!-- FASE 1 -->\n      <div class=\"two-col\">\n        <div class=\"two-col-label\">\n          <span class=\"phase-label\">Fase 1<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"two-col-content\">\n          <p class=\"section-heading\">Ricerca, analisi e progettazione<\u002Fp>\n          <p class=\"section-sub\">Dalla strategia al wireframe approvato<\u002Fp>\n          <p class=\"body-text\">Il lavoro è iniziato a maggio 2026 con una fase di ricerca e analisi approfondita: studio del mercato della residenzialità universitaria e del co-living in Italia, analisi dei competitor diretti e indiretti, raccolta delle referenze visive e progettuali coerenti con l'identità di City Campus. In parallelo, sono stati raccolti e organizzati tutti i materiali necessari — render degli spazi (prodotti internamente), dati tecnici del campus, contenuti fotografici disponibili e specifiche operative.<\u002Fp>\n          <p class=\"body-text\">Sulla base di questa ricerca è stata definita l'architettura della pagina: struttura narrativa in quindici sezioni, gerarchia dei contenuti, flusso utente dalla scoperta del campus alla prenotazione della visita. Il wireframe è stato progettato in Figma e sottoposto a un ciclo intensivo di revisione condivisa con il team: otto sessioni di confronto e affinamento tra maggio e giugno. Approvato definitivamente il 16 giugno 2026.<\u002Fp>\n          <p class=\"body-text\">I testi per tutte le sezioni della pagina sono stati redatti e revisionati in collaborazione con Tommy attraverso lo stesso ciclo iterativo. La versione in lingua inglese sarà curata dal team. L'ambiente tecnico è stato predisposto: sottodominio <em>margherita.citycampusvicenza.it<\u002Fem>, WordPress installato e configurato, certificato SSL attivo.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <hr class=\"rule-light\" style=\"margin-bottom:48px;\">\n\n      <!-- FASE 2 -->\n      <div class=\"two-col\">\n        <div class=\"two-col-label\">\n          <span class=\"phase-label\">Fase 2<\u002Fspan>\n          <br><span style=\"font-size:9px;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;\">Da oggi<br>al 3 luglio<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"two-col-content\">\n          <p class=\"section-heading\">Produzione e sviluppo<\u002Fp>\n          <p class=\"section-sub\">Realizzazione della pagina<\u002Fp>\n          <p class=\"body-text\">Sviluppo completo della landing page in WordPress con Gutenberg, a partire dal wireframe approvato. Include la realizzazione di tutte le sezioni, il design adattivo per dispositivi mobile e desktop, l'inserimento dei render prodotti internamente e delle foto delle stanze e dei locali comuni. Integrazione tecnica del Booking Engine WuBook nella pagina. Configurazione del form di contatto con proposta di date per la visita al campus e attivazione dell'email automatica di benvenuto. Installazione e configurazione del Meta Pixel per il tracciamento delle conversioni. Ottimizzazione SEO on-page, installazione e configurazione della gestione dei cookie e della pagina di informativa sulla privacy.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <hr class=\"rule-light\" style=\"margin-bottom:48px;\">\n\n      <!-- FASE 3 -->\n      <div class=\"two-col\">\n        <div class=\"two-col-label\">\n          <span class=\"phase-label\">Fase 3<\u002Fspan>\n          <br><span style=\"font-size:9px;color:#bbb;letter-spacing:0.08em;text-transform:uppercase;\">Go-live<br>3 luglio 2026<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"two-col-content\">\n          <p class=\"section-heading\">Revisione e pubblicazione<\u002Fp>\n          <p class=\"section-sub\">Test, ottimizzazione e go-live<\u002Fp>\n          <p class=\"body-text\">Revisione dei contenuti con il team, test di funzionamento su mobile e desktop, verifica di tutti i flussi di contatto e dell'email automatica di benvenuto, ottimizzazione finale e pubblicazione. Obiettivo go-live: 3 luglio 2026.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ══ GESTIONE CONTINUATIVA ══ -->\n      <div class=\"section-header\" style=\"margin-top:16px;\">\n        <p>Gestione continuativa<\u002Fp>\n        <p>Canone mensile<\u002Fp>\n      <\u002Fdiv>\n      <hr class=\"rule\">\n\n      <div class=\"two-col\">\n        <div class=\"two-col-label\">Canone<br>mensile<\u002Fdiv>\n        <div class=\"two-col-content\">\n          <p class=\"section-heading\">Manutenzione, sicurezza, SEO e aggiornamenti<\u002Fp>\n          <p class=\"body-text\" style=\"margin-top:16px;\">Il canone mensile comprende la gestione tecnica ordinaria della landing page, gli aggiornamenti di sicurezza e delle componenti WordPress, le modifiche ai contenuti, il monitoraggio e l'ottimizzazione SEO continuativa, la supervisione del Booking Engine WuBook, la gestione tecnica dei cookie e della privacy policy. Report trimestrale con analisi delle performance e indicazioni operative. La comunicazione diretta con i contatti raccolti resta in carico al team.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fd
